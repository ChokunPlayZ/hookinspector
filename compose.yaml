services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      DEFAULT_TTL_HOURS: ${DEFAULT_TTL_HOURS:-24}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      MAX_REQUESTS_PER_INBOX: ${MAX_REQUESTS_PER_INBOX:-100}
      MAX_INBOXES: ${MAX_INBOXES:-1000}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-268435456}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-32}
      CREATE_RATE_LIMIT: ${CREATE_RATE_LIMIT:-10}
      WEBHOOK_RATE_LIMIT: ${WEBHOOK_RATE_LIMIT:-120}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - inbox-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  inbox-data:
